<!DOCTYPE html>
<html>
<head>
	<title>my first webpage</title>
	<style>
		body{
			font-family: Arial, sans-serif;
			margin:0;
			background-color: #f2f2f2;
			text-align: center;
		}
		header{
			background-color: #333;
			color: white;
			padding: 20px;
		}
		nav{
			background-color: #555;
			padding: 10px;
		}
		nav a{
			color: white;
			text-decoration: none;
			margin: 20px;
		}
		main{
			padding: 50px;
		}
		h1{
			color: #333;
		}
		button{
			padding: 10px 20px;
			font-size: 16px;
			cursor: pointer;
		}
		footer{
			background-color: #333;
			color: white;
			padding: 15px;
			margin-top: 50px;
		}
	</style>
</head>
<body>
	<header>
		<h1>My first webpage</h1>
		<p>welcome to my website</p>
	</header>
	
	<nav>
		<a href="#">Home</a>
		<a href="#">About</a>
		<a href="#">Contact</a>
	</nav>

	<main>
		<h1>hello world!</h1>

		<p>
			this is my first webpage created using HTML and CSS
		</p>

		<button>Click Me</button>
	</main>
	
	<footer>
		<p>2026 my website</p>
	</footer>

</body>
</html>
